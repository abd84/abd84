<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-label="Animated neural network">
  <defs>
    <linearGradient id="wire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </radialGradient>
  </defs>
  <rect width="900" height="220" fill="#0a0e17" rx="16"/>
  <g stroke="url(#wire)" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M80,110 L200,60 L320,110 L440,50 L560,110 L680,70 L820,110"/>
    <path d="M80,110 L200,160 L320,110 L440,170 L560,110 L680,150 L820,110"/>
    <path d="M200,60 L200,160"/><path d="M320,110 L440,170"/><path d="M560,110 L680,150"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="80" cy="110" r="10" fill="url(#node)"><animate attributeName="r" values="8;11;8" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="60" r="9" fill="url(#node)"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="160" r="9" fill="url(#node)"><animate attributeName="opacity" values="1;0.5;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="110" r="12" fill="url(#node)"><animate attributeName="r" values="10;14;10" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="50" r="8" fill="#ff6b6b"><animate attributeName="cy" values="50;55;50" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="170" r="8" fill="#ff6b6b"><animate attributeName="cy" values="170;165;170" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="110" r="11" fill="url(#node)"><animate attributeName="r" values="9;13;9" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="70" r="9" fill="url(#node)"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="150" r="9" fill="url(#node)"><animate attributeName="opacity" values="1;0.4;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="110" r="13" fill="url(#node)"><animate attributeName="r" values="11;15;11" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>
  <circle r="4" fill="#00f5d4" opacity="0.9">
    <animateMotion dur="4s" repeatCount="indefinite" path="M80,110 L200,60 L320,110 L440,50 L560,110 L680,70 L820,110"/>
  </circle>
  <circle r="3" fill="#ff6b6b" opacity="0.8">
    <animateMotion dur="5.5s" repeatCount="indefinite" path="M80,110 L200,160 L320,110 L440,170 L560,110 L680,150 L820,110"/>
  </circle>
  <text x="450" y="205" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">INFERENCE GRAPH · MULTIMODAL FUSION · ACTIVE</text>
</svg>
